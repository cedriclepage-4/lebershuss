<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Shuss League logo: zwarte ruit met witte vis, grijze "baksteen"-schaduw -->
  <defs>
    <clipPath id="schaduwzone">
      <polygon points="46,6 86,46 46,86 6,46"/>
    </clipPath>
  </defs>
  <!-- schaduwruit met baksteenmotief (linksboven) -->
