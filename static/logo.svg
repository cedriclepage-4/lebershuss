      <line x1="0" y1="34" x2="100" y2="34"/>
      <line x1="0" y1="46" x2="100" y2="46"/>
      <line x1="0" y1="58" x2="100" y2="58"/>
      <line x1="0" y1="70" x2="100" y2="70"/>
      <line x1="24" y1="10" x2="24" y2="22"/>
      <line x1="40" y1="22" x2="40" y2="34"/>
      <line x1="18" y1="34" x2="18" y2="46"/>
      <line x1="34" y1="46" x2="34" y2="58"/>
      <line x1="26" y1="58" x2="26" y2="70"/>
    </g>
  </g>
  <!-- hoofdruit -->
